[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slap-mapd-coupling"
version = "0.1.0"
authors = [
    { name = "Bjarke Karlsen" }
]
description = "Coupled storage-assignment (SLAP) / multi-agent pickup-and-delivery (MAPD) simulation and RL controllers for a warehouse graph."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "ray[rllib]>=2.9.0",
    "torch>=2.0.0",
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "networkx>=3.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=5.0.0",
    "mypy>=0.990",
]
viz = [
    "pygame>=2.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=html"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[project.scripts]
slap-mapd = "slap_mapd_coupling.main:cli"
