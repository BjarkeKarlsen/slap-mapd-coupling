[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-robot-rl"
version = "0.1.0"
authors = [
    { name = "Bjarke Karlsen", email = "bjarke@example.com" }
]
description = "Hierarchical multi-agent RL for robot task learning"
requires-python = ">=3.8"
dependencies = [
    "ray[rllib]>=2.0.0",
    "torch>=1.12.0",
    "gymnasium>=0.27.0",
    "numpy>=1.21.0",
    "pygame>=2.1.0",
]
dynamic = ["scripts"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=5.0.0",
    "mypy>=0.990",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=html"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[project.scripts]
robot-rl = "hierarchical_robot_rl.main:cli"