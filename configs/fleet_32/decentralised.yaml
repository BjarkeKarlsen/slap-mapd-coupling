# The training run of the 8-agent warehouse with robots carrying the put-away, read by
# `slap-mapd train`. The four files of configs/medium_putaway differ only in `controller`. Each
# is its namesake in configs/medium_arrival with three changes. The instance has receiving
# vertices on row 0, the inbound side, as many as it has delivery vertices
# (`num_receiving_vertices`). Stock arrives at them (`arrival.receiving: receiving`). Every
# (SKU, shelf) of an arrival is a put-away task, and its units can be picked only once it is
# delivered (`arrival.putaway: robots`).
#
# Values are illustrative and are not thesis values, apart from the arrival rate, which the
# Token Passing load sweep sets (scripts/sweep/load_sweep.py). Everything else is
# configs/medium_arrival. See training/spec.py for what each section means.


controller: decentralised
regime: fixed_only          # fixed_only | matched
communication: false        # decentralised arm only
evaluation_storage_mode: fixed

# Selected main load from the fixed-storage Token Passing load sweep, 0.6 of the highest rate at
# which fixed storage keeps up on every seed (scripts/sweep/load_sweep.py). A sampling call of a
# runner is one complete episode, and the budget below counts timesteps, one per timestep however
# many robots choose within it.
arrival_rate: 0.36
horizon: 2000

experiment:
  num_agents: 32
  wait_cost: 0.2            # c_wait, one value for the graph and the reward, after van Knippenberg et al. (2021)
  keep_up_threshold: 0.8    # f_up of eq:throughput
  observation_depth: 5      # d_obs
  discount: 0.99            # gamma
  # n_deliver is raised well above 1.0. A 5000-iteration run on this instance showed rising
  # training return with zero evaluation completions, consistent with the per-step shaping
  # term outweighing a small completion bonus.
  deliver_reward: 10.0
  override_penalty: 0.5
  move_cost: 0.1            # c_move, after van Knippenberg et al. (2021)
  congestion_reward_weight: 0.1
  congestion_sensitive: false
  seed: 0

# No instance section: the warehouse follows experiment.num_agents
# (instances/generator.py::fleet_defaults). An `instance:` section would build that one instead.

# 100 SKUs of three sizes (unit capacities 0.5, 1 and 2 cycle over them), with the most popular
# SKUs at the storage vertices nearest the delivery vertices. Each SKU starts with its expected
# orders over one arrival period, with the margin, and at least 8 units, the floor of every
# arrival too. Each vertex holds up to 200. An order picks a SKU by its popularity and takes a
# unit from the shelf holding it nearest its delivery vertex, or waits for the next arrival.
# See StorageSettings, ArrivalSettings and DemandSettings.
storage:
  num_skus: 100
  # One name per SKU, e.g. [tea, coffee, mugs, ...]. The first is the most popular at t = 0.
  # null names them sku_000, sku_001 and so on.
  sku_names: null
  unit_capacities: [0.5, 1.0, 2.0]
  vertex_capacity: 200.0
  initial_units: 8
  initial_placement: demand_sized_blocks

# SKU popularity is Zipf with the given skew, and the ranking rotates by 5 places every 200 steps.
demand:
  skew: 1.0
  rotation_period: 200
  rotation_shift: 5

# Delta, the arrival period of every storage rule, and beta of the congestion rule, used by
# `slap-mapd evaluate --storage-modes`. Nothing is relocated, so there is no nu.
storage_rule:
  epoch_length: 100
  congestion_weight: 1.0

# The arrival stock model. Each SKU is filled up to max(8, ceil((1 + margin) * its orders in the
# last period)). The stock arrives at the receiving vertices and robots carry it to its shelves.
arrival:
  margin: 1.0
  receiving: receiving
  putaway: robots
  # The cold-stock measure: a SKU outside the top 10 of the current ranking is cold, and the
  # prime shelves are the nearest ones the starting placement gives the top 10. Evaluation only.
  cold_stock_top_k: 10

arm:
  num_zones: 3              # section arm only, a sweep parameter (tab:modelparams)
  # max_messages defaults to num_agents - 1, so no sender is dropped. Communication only.

model:
  num_rounds: 2
  hidden_width: 32
  head_hidden_width: 32

ppo:
  lr: 0.0003
  clip_param: 0.2
  gae_lambda: 0.95
  minibatch_size: 128
  num_epochs: 5
  entropy_coeff: 0.02
  vf_loss_coeff: 1.0
  training_budget_env_steps: 500000

train_seed_count: 100
validation_seed_count: 2
test_seed_count: 6

checkpoint:
  frequency: 3              # iterations between checkpoints, 0 keeps only the one at the end
  num_to_keep: null         # keep every one, a checkpoint is chosen on validation seeds
  score_attribute: episode_return_mean   # a top-level key of the result
  score_order: max
