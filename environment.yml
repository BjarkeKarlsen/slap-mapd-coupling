name: robot-rl
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.10
  - pytorch::pytorch::cpuonly  # or pytorch::pytorch::pytorch-cuda=11.8
  - pytorch::pytorch-cuda=11.8
  - pip
  - pip-tools
  - pip:
    - ray[rllib]==2.x.x
    - gymnasium==0.27.x
    - numpy>=1.21.0
    - pygame>=2.1.0
    - tensorboard>=2.10.0
    - click>=8.0.0        # For CLI argument parsing
    - pyyaml>=6.0         # For config files
    - pytest>=7.0.0       # Testing
    - pytest-cov>=4.0.0   # Coverage
    - black>=23.0.0       # Code formatting
    - flake8>=5.0.0       # Linting
    - mypy>=0.990         # Type checking